name: Daily Scan Pipeline

on:
  schedule:
    # 10:00 UTC daily; adjust to your market close timezone
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-daily-scan:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_UNIVERSE_TABLE: ${{ secrets.SUPABASE_UNIVERSE_TABLE }}
          SUPABASE_SCAN_RESULTS_TABLE: ${{ secrets.SUPABASE_SCAN_RESULTS_TABLE }}
          SUPABASE_MARKET: ${{ secrets.SUPABASE_MARKET }}
          SUPABASE_TICKER_FIELD: ${{ secrets.SUPABASE_TICKER_FIELD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
        run: |
          python scripts/daily_scan_pipeline.py \
            --universe-source csv \
            --universe-csv stock_universe.csv \
            --top-k-scan 20 \
            --top-k-deep 5
